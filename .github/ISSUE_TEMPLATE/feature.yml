name: Feature request
description: Propose a new capability for the PiRC1 standards proposal
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who hits it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: A concrete description of the new capability and its contract.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design sketch
      description: |
        Interfaces, data flow, or a short example. The seams are fixed
        (PEP signature → tier logic → manifest schema) — show where the
        feature plugs in, and which standard file it touches.
  - type: textarea
    id: tests
    attributes:
      label: Testing plan
      description: How will this be tested offline with deterministic logic?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I read CONTRIBUTING.md and ROADMAP.md
        - label: My proposal keeps `npm test` green
        - label: New protocol logic stays offline-testable (no network / keys required)
